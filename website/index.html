function initialState() {
    return { lang: 'zh', surface: 'mobile', os: 'windows', view: 'feed', enabled: false, refreshed: false, captured: [], opened: [], saved: {}, query: '', category: 'all', selected: null };
}
function copy(state) {
    return { ...state, captured: [...state.captured], opened: [...state.opened], saved: { ...state.saved } };
}
function reduce(state, action) {
    const next = copy(state);
    const isPost = (id) => posts.some(p => p.id === id);
    switch (action.type) {
        case 'enable':
            next.enabled = action.value;
            break;
        case 'observe':
            if (state.enabled && state.view === 'feed' && isPost(action.id) &&
                posts.find(p => p.id === action.id)?.batch === Number(state.refreshed) && !next.captured.includes(action.id))
                next.captured.push(action.id);
            break;
        case 'refresh':
            next.refreshed = true;
            next.view = 'feed';
            next.query = '';
            next.selected = null;
            break;
        case 'view':
            next.view = action.value;
            next.query = '';
            next.category = 'all';
            next.selected = null;
            break;
        case 'search':
            next.query = action.value.slice(0, 120);
            break;
        case 'category':
            next.category = action.value;
            break;
        case 'save':
            if (isPost(action.id) && !next.saved[action.id])
                next.saved[action.id] = { category: 'ideas', note: '' };
            break;
        case 'remove':
            delete next.saved[action.id];
            break;
        case 'edit':
            if (next.saved[action.id])
                next.saved[action.id] = { category: action.entry.category, note: action.entry.note.slice(0, 280) };
            break;
        case 'open':
            if (isPost(action.id)) {
                next.selected = action.id;
                if (!next.opened.includes(action.id))
                    next.opened.push(action.id);
            }
            break;
        case 'clear-recent':
            next.captured = [];
            if (state.view === 'recent')
                next.selected = null;
            break;
        case 'reset': return { ...initialState(), lang: state.lang, surface: state.surface, os: state.os };
        case 'lang':
            next.lang = action.value;
            break;
        case 'surface':
            next.surface = action.value;
            break;
        case 'os':
            next.os = action.value;
            break;
    }
    return next;
}
function visiblePosts(state) {
    const q = state.query.trim().toLocaleLowerCase();
    return posts.filter(p => {
        const included = state.view === 'feed' ? p.batch === Number(state.refreshed) :
            state.view === 'recent' ? state.captured.includes(p.id) :
                state.view === 'history' ? state.opened.includes(p.id) : Object.prototype.hasOwnProperty.call(state.saved, p.id);
        if (!included)
            return false;
        if (state.view === 'saved' && state.category !== 'all' && state.saved[p.id]?.category !== state.category)
            return false;
        if (!q)
            return true;
        const haystack = [p.author.zh, p.author.en, p.handle, p.body.zh, p.body.en, p.topic.zh, p.topic.en, state.saved[p.id]?.note ?? ''].join(' ').toLocaleLowerCase();
        return haystack.includes(q);
    });
}
function progress(state) {
    if (Object.keys(state.saved).length)
        return 4;
    if (state.refreshed && (state.view === 'recent' || state.query))
        return state.query.trim() ? 3 : 2;
    return state.refreshed ? 1 : 0;
}

dialog.addEventListener('click', handleAction);
function handleAction(event) {
    const target = event.target;
    const button = target.closest('[data-action]');
    if (!button)
        return;
    const action = button.dataset.action, key = button.dataset.key, id = button.dataset.id;
    switch (action) {
        case 'lang': {
            const scrollY = window.scrollY;
            state = reduce(state, { type: 'lang', value: state.lang === 'zh' ? 'en' : 'zh' });
            mount();
            focusKey('lang');
            window.scrollTo(0, scrollY);
            break;
        }
        case 'menu':
            showDialog(`${closeButton()}<h2 id="dialog-title">${t('探索 Xs', 'Explore Xs')}</h2><nav class="dialog-nav" aria-label="${t('手机导航', 'Mobile navigation')}">${navLinks()}${ext('GitHub', '')}</nav>`, 'menu');
            break;
        case 'close-dialog':
            closeDialog();
            break;
        case 'surface':
            dispatch({ type: 'surface', value: button.dataset.value === 'desktop' ? 'desktop' : 'mobile' }, key);
            break;
        case 'os':
            dispatch({ type: 'os', value: button.dataset.value === 'macos' ? 'macos' : 'windows' }, key);
            break;
        case 'view': {
            const view = button.dataset.value;
            if (['feed', 'recent', 'history', 'saved'].includes(view)) {
                dispatch({ type: 'view', value: view }, key);
                const scroll = document.querySelector('.post-scroll');
                if (scroll)
                    scroll.scrollTop = 0;
            }
            break;
        }
        case 'start':
            dispatch({ type: 'enable', value: true }, 'guide-action');
            announce(t('本页演示缓冲已开启。浏览右侧帖子，再试一次刷新。', 'Demo buffer enabled. Browse the posts, then simulate a refresh.'));
            document.querySelector('#demo-device')?.scrollIntoView({ block: 'center', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
            break;
        case 'refresh':
            dispatch({ type: 'refresh' }, key);
            document.querySelector('.post-scroll')?.scrollTo(0, 0);
            announce(state.enabled ? t('示意时间线已刷新；已观察到的旧内容仍在「最近」里。', 'Demo feed refreshed. Observed earlier posts remain in Recent.') : t('已模拟刷新，但缓冲未开启。重置后开启演示再试试。', 'Refreshed without a buffer. Reset and enable the demo to try recovery.'));
            break;
        case 'find':
            dispatch({ type: 'view', value: 'recent' }, 'guide-action');
            announce(t('这里是本次演示实际观察到的临时记录。', 'These are the temporary posts observed during this demo.'));
            break;
        case 'search-example':
            dispatch({ type: 'search', value: t('留白', 'space') });
            document.querySelector('#demo-search')?.focus({ preventScroll: true });
            break;
        case 'clear-search':
            dispatch({ type: 'search', value: '' });
            document.querySelector('#demo-search')?.focus({ preventScroll: true });
            break;
        case 'save-first': {
            const post = visiblePosts(state)[0];
            if (post) {
                dispatch({ type: 'save', id: post.id }, 'guide-action');
                announce(t('已加入示意收藏。清空临时记录也不会移除它。', 'Saved in the demo. Clearing temporary records will not remove it.'));
            }
            else
                announce(t('没有可收藏的结果，请先清空或更换关键词。', 'No results to save. Clear or change the search first.'));
            break;
        }
        case 'save':
            if (id) {
                dispatch({ type: 'save', id }, key);
                announce(t('已加入示意收藏，没有修改 X 书签。', 'Saved in the demo. X bookmarks are unchanged.'));
            }
            break;
        case 'remove':
            if (id) {
                dispatch({ type: 'remove', id }, key);
                announce(t('已取消示意收藏。', 'Demo bookmark removed.'));
                if (!document.querySelector(`[data-key="${key}"]`))
                    focusKey('view-saved');
            }
            break;
        case 'saved-view':
            dispatch({ type: 'view', value: 'saved' }, 'view-saved');
            break;
        case 'feed-view':
            dispatch({ type: 'view', value: 'feed' }, 'view-feed');
            break;
        case 'clear-recent':
            dispatch({ type: 'clear-recent' }, key);
            announce(t('临时记录已清空，示意收藏与打开记录保留。', 'Temporary records cleared. Saved posts and demo opens are preserved.'));
            break;
        case 'reset':
            dispatch({ type: 'reset' }, 'guide-action');
            announce(t('演示已重置，示意收藏已清空，缓冲恢复关闭。', 'Demo reset. Saved examples cleared; buffer is off again.'));
            break;
        case 'open':
            if (id)
                postDialog(id, key ?? null);
            break;
        case 'edit':
            if (id)
                editDialog(id, key ?? null);
            break;
        case 'dialog-save':
            if (id) {
                dispatch({ type: 'save', id });
                closeDialog();
                announce(t('已加入示意收藏。', 'Saved in this demo.'));
            }
            break;
        case 'category':
            dispatch({ type: 'category', value: button.dataset.value }, key);
            break;
        case 'all-categories':
            dispatch({ type: 'category', value: 'all' }, 'category-all');
            break;
        case 'try-windows':
        case 'try-macos':
            state = reduce(state, { type: 'surface', value: 'desktop' });
            dispatch({ type: 'os', value: action === 'try-macos' ? 'macos' : 'windows' });
            scrollToDemo();
            focusKey('surface-desktop');
            break;
    }
}
site.addEventListener('input', event => {
    const input = event.target;
    if (input.id !== 'demo-search')
        return;
    state = reduce(state, { type: 'search', value: input.value });
    // Keep the search input alive so IME composition, cursor position and focus are never interrupted.
    const panel = document.querySelector('#post-panel');
    if (panel)
        panel.innerHTML = visiblePosts(state).length ? visiblePosts(state).map(postCard).join('') : emptyState();
    const count = document.querySelector('#result-count');
    if (count)
        count.textContent = `${visiblePosts(state).length} ${t('条示例', 'demo posts')}`;
    const guideEl = document.querySelector('.demo-guide');
    if (guideEl)
        guideEl.outerHTML = guide();
});
site.addEventListener('submit', event => { if (event.target.classList.contains('search-form'))
    event.preventDefault(); });
dialog.addEventListener('submit', event => {
    const form = event.target;
    if (form.id !== 'edit-form')
        return;
    event.preventDefault();
    const data = new FormData(form), id = form.dataset.id;
    if (!id)
        return;
    dispatch({ type: 'edit', id, entry: { category: data.get('category') === 'reading' ? 'reading' : 'ideas', note: String(data.get('note') ?? '') } });
    closeDialog();
    announce(t('示意分类与备注已保存。', 'Demo category and note saved.'));
});
dialog.addEventListener('close', () => { document.body.classList.remove('dialog-open'); if (returnFocus)
    focusKey(returnFocus); returnFocus = null; });
dialog.addEventListener('click', event => {
    const link = event.target.closest('a[href^="#"]');
    if (link) {
        closeDialog();
        window.setTimeout(() => document.querySelector(link.hash)?.focus({ preventScroll: true }), 0);
    }
    if (event.target === dialog) {
        const rect = dialog.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)
            closeDialog();
    }
});
document.addEventListener('keydown', event => {
    const active = document.activeElement;
    if (!active)
        return;
    const group = active.dataset.tabGroup;
    if (group && ['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) {
        const buttons = Array.from(document.querySelectorAll(`[data-tab-group="${group}"]`));
        let index = buttons.indexOf(active);
        if (index < 0)
            return;
        event.preventDefault();
        index = event.key === 'Home' ? 0 : event.key === 'End' ? buttons.length - 1 : (index + (['ArrowLeft', 'ArrowUp'].includes(event.key) ? -1 : 1) + buttons.length) % buttons.length;
        buttons[index]?.click();
        return;
    }
    if (event.key === 'Escape' && active.id === 'demo-search') {
        dispatch({ type: 'search', value: '' });
        document.querySelector('#demo-search')?.focus({ preventScroll: true });
    }
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k' && document.querySelector('#experience')?.contains(active) && !dialog.open) {
        event.preventDefault();
        dispatch({ type: 'view', value: 'recent' });
        document.querySelector('#demo-search')?.focus({ preventScroll: true });
    }
});
document.addEventListener('visibilitychange', observeDemo);
mount();
</script>
</body>
</html>
