name: xs-core-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  java-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test dependency-free core
        run: bash scripts/test-core.sh
