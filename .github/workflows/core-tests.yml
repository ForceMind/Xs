name: xs-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check bilingual docs and independent source tree
        run: bash scripts/check-project.sh
      - name: Compile JVM code and check real SQLite
        run: bash scripts/test-core.sh
  android-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile independent Android archive AAR
        run: gradle --no-daemon :xs-runtime:assembleDebug :dev-harness:assembleDebug
      - name: Upload Android library (not an APK)
        uses: actions/upload-artifact@v4
        with:
          name: xs-runtime-debug-aar
          path: xs-runtime/build/outputs/aar/*.aar
          if-no-files-found: error
      - name: Upload development test host (NOT X)
        uses: actions/upload-artifact@v4
        with:
          name: xs-dev-harness-only
          path: dev-harness/build/outputs/apk/debug/*.apk
          if-no-files-found: error
