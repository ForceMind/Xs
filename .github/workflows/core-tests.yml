name: xs-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check bilingual docs and independent source tree
        run: bash scripts/check-project.sh
      - name: Compile JVM code and check real SQLite
        run: bash scripts/test-core.sh
      - name: Check 10k and 100k preserving migrations and search capacity
        run: |
          mkdir -p build/core-provenance
          git rev-parse HEAD > build/core-provenance/source-commit.txt
          git rev-parse HEAD^{tree} > build/core-provenance/source-tree.txt
          python3 tests/sqlite_capacity_benchmark.py --sizes 10000 100000 --output build/core-provenance/capacity.json
          python3 scripts/record-source-inventory.py --output build/core-provenance/source-and-notice-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: xs-core-capacity-and-source
          path: build/core-provenance/
          if-no-files-found: error
  android-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile independent Android archive AAR
        run: gradle --no-daemon :xs-runtime:assembleDebug :dev-harness:assembleDebug :app-android:assembleDebug :app-android:assembleDebugAndroidTest :dev-harness:assembleDebugAndroidTest :app-android:lintDebug :xs-runtime:lintDebug
      - name: Upload Android library (not an APK)
        uses: actions/upload-artifact@v4
        with:
          name: xs-runtime-debug-aar
          path: xs-runtime/build/outputs/aar/*.aar
          if-no-files-found: error
      - name: Upload development test host (NOT X)
        uses: actions/upload-artifact@v4
        with:
          name: xs-dev-harness-only
          path: dev-harness/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Record PoC build provenance
        run: |
          mkdir -p app-android/build/provenance
          git rev-parse HEAD > app-android/build/provenance/source-commit.txt
          sha256sum app-android/build/outputs/apk/debug/*.apk > app-android/build/provenance/SHA256SUMS
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app-android/build/outputs/apk/debug/app-android-debug.apk > app-android/build/provenance/signing-certificate.txt
          gradle --no-daemon :app-android:dependencies --configuration debugRuntimeClasspath > app-android/build/provenance/dependencies.txt
          python3 scripts/record-source-inventory.py --output app-android/build/provenance/source-and-notice-inventory.json
      - name: Upload non-instrumented browser feasibility APK (NOT Alpha)
        uses: actions/upload-artifact@v4
        with:
          name: xs-w0-browser-poc
          path: |
            app-android/build/outputs/apk/debug/*.apk
            app-android/build/provenance/
          if-no-files-found: error

  android-instrumentation:
    needs: android-library
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 27, 30, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p app-android/build/compatibility
            git rev-parse HEAD > app-android/build/compatibility/source-commit.txt
            adb shell getprop ro.build.version.release > app-android/build/compatibility/android-release.txt
            adb shell getprop ro.build.version.sdk > app-android/build/compatibility/android-api.txt
            adb shell getprop persist.sys.locale > app-android/build/compatibility/locale.txt
            adb shell am get-config > app-android/build/compatibility/device-configuration.txt
            adb shell dumpsys webviewupdate > app-android/build/compatibility/webview-provider.txt
            adb shell cmd uimode night > app-android/build/compatibility/night-mode.txt
            gradle --no-daemon --no-parallel --continue :dev-harness:connectedDebugAndroidTest :app-android:connectedDebugAndroidTest
            python3 scripts/test-process-recovery.py
            python3 scripts/test-debug-upgrade.py
      - name: Record job-local fixture APK hashes and public signing certificates
        if: always()
        run: python3 scripts/record-fixture-provenance.py
      - name: Upload synthetic Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xs-android-test-reports-api-${{ matrix.api-level }}
          path: |
            app-android/build/compatibility/
            app-android/build/reports/androidTests/
            app-android/build/outputs/androidTest-results/
            dev-harness/build/reports/androidTests/
            dev-harness/build/outputs/androidTest-results/
